site_name: Gallium
site_description: Developer documentation for the Gallium runtime library
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Getting started:
      - First application: getting-started.md
      - Architecture: architecture.md
  - Core concepts:
      - Platform & input: platform.md
      - GPU: gpu.md
      - Rendering: rendering.md
      - Assets: assets.md
      - Audio: audio.md
      - Messaging & events: messaging.md
      - Core utilities: core.md
  - API reference:
      - Overview: api/index.md
      - Platform: api/platform.md
      - GPU: api/gpu.md
      - Rendering: api/rendering.md
      - Assets: api/assets.md
      - Audio: api/audio.md
      - Core: api/core.md
  - Guide:
      - Calcium3D integration: calcium3d.md
      - Tips & notes: tips.md
